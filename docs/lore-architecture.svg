<text x="48" y="60" font-size="27" font-weight="800" fill="#1F1F1F">Lore · how a day becomes a page</text>
<text class="what" x="48" y="88">Green is you. Numbered steps run on your phone or on Lore&#x27;s backend; dashed boxes are outside models. Five minutes of talk a day costs about $0.031 (free) or $0.032 (premium); three quarters of that is transcription.</text>
